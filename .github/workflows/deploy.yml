name: Deploy Training Platform

on:
  push:
    branches:
      - main

  workflow_dispatch:

  repository_dispatch:
    types:
      - content-updated

jobs:

  deploy:

    name: Deploy to Homelab

    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Update submodules
        run: |
         git submodule update --init --recursive
         git submodule update --remote --recursive

      - name: Build Training Platform image
        working-directory: stacks/training-platform
        run: |
          docker build -t training-platform:test .

      - name: Validate MkDocs build
        working-directory: stacks/training-platform
        run: |
          docker run --rm training-platform:test mkdocs build --strict

      - name: Deploy Training Platform
        working-directory: stacks/training-platform
        run: |
          chmod +x deploy.sh
          ./deploy.sh

      - name: Check container status
        run: |
          docker ps --filter name=training-platform
