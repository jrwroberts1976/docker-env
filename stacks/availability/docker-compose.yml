services:

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    container_name: uptime-kuma
#    ports:
#      - "3001:3001"
    volumes:
      - /home/james/docker/data/availability/uptime-kuma/data:/app/data
    restart: unless-stopped
    environment:
      - TZ=Europe/London
    networks:
      - apps


  autokuma:
    image: ghcr.io/bigboot/autokuma@sha256:8acbd3ad3ec8cb6c066aa0ee541154921283ec78159015937128541921c47974
    container_name: autokuma
    depends_on:
      uptime-kuma:
        condition: service_started
    environment:
      AUTOKUMA__KUMA__URL: "http://uptime-kuma:3001"
      AUTOKUMA__KUMA__USERNAME: "${AUTOKUMA_KUMA_USERNAME}"
    secrets:
      - autokuma_kuma_password
    volumes:
      - /home/james/docker/data/availability/autokuma/config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        export AUTOKUMA__KUMA__PASSWORD="$$(cat /run/secrets/autokuma_kuma_password)"
        sleep 30
        exec autokuma
    networks:
      - apps


  smokeping:
    image: linuxserver/smokeping:latest@sha256:a0d1e57744a2217a0fe83b7828cffe2cbce16f44e59c858bead8ff41e7b63581
    container_name: smokeping
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/james/docker/data/availability/smokeping/data:/data
      - smokeping-config:/config
#    ports:
#      - "85:80"
    restart: unless-stopped
    networks:
      - apps
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"


  librespeed:
    image: ${LIBRESPEED_IMAGE:-ghcr.io/librespeed/speedtest:6.2.1}
    container_name: librespeed
#    ports:
#      - "8085:8080"
    environment:
      MODE: standalone
      TELEMETRY: "false"
    volumes:
      - /home/james/docker/data/availability/librespeed/config:/config
    restart:
      unless-stopped
    networks:
      - apps
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"


networks:
  apps:
    external: true
    name: homelab_apps


volumes:
  smokeping-config:

secrets:
  autokuma_kuma_password:
    file: /home/james/docker/secrets/autokuma-kuma-password
