services:

  crowdsec-exporter:
    image: monitoring-crowdsec-exporter:local
    container_name: crowdsec-exporter
    build:
      context: ./crowdsec-exporter
      args:
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
        BUILD_CREATED: ${BUILD_CREATED:-unknown}
        BUILD_SOURCE: ${BUILD_SOURCE:-https://github.com/jrwroberts1976/docker-env}
    restart: unless-stopped

    network_mode: host

    cap_add:
      - NET_ADMIN

    volumes:
      - /run/xtables.lock:/run/xtables.lock

    labels:
      - "wud.watch=false"
      - "wud.watch.digest=false"


  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.1}
    container_name: prometheus
    user: "1000:1000"
    restart: unless-stopped

    ports:
      - "192.168.2.220:9090:9090"

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

    volumes:
      - /home/james/docker/data/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /home/james/docker/data/monitoring/prometheus/linux-hosts.yml:/etc/prometheus/linux-hosts.yml:ro
      - /home/james/docker/data/monitoring/prometheus/data:/prometheus

    networks:
      - apps


  loki:
    image: ${LOKI_IMAGE:-grafana/loki:2.9.6}
    container_name: loki
    restart: unless-stopped

    ports:
      - "192.168.2.220:3100:3100"

    command:
      - -config.file=/etc/loki/local-config.yaml

    volumes:
      - /home/james/docker/data/monitoring/loki/data:/loki
      - /home/james/docker/data/monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml

    networks:
      - apps






  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.12.1}
    container_name: node-exporter
    restart: unless-stopped

    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.textfile.directory=/textfile

    volumes:
      - /:/host:ro,rslave
      - /home/james/docker/data/monitoring/node-exporter/textfile:/textfile:ro

    ports:
      - "192.168.2.220:9100:9100"

    networks:
      - apps

    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"

  cadvisor:
    image: ${CADVISOR_IMAGE:-ghcr.io/google/cadvisor:0.60.5}
    container_name: cadvisor
    restart: unless-stopped

    privileged: true

    ports:
      - "192.168.2.220:8089:8080"

    devices:
      - /dev/kmsg:/dev/kmsg

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    networks:
      - apps

    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"

  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE:-prom/blackbox-exporter:v0.28.0}
    container_name: blackbox-exporter
    restart: unless-stopped

    ports:
      - "192.168.2.220:9115:9115"

    volumes:
      - /home/james/docker/data/monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

    command:
      - --config.file=/etc/blackbox_exporter/config.yml

    networks:
      - apps

    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"

networks:
  apps:
    external: true
    name: homelab_apps

