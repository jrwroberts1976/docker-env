services:

  crowdsec-exporter:
    container_name: crowdsec-exporter
    build: 
      context: /home/james/docker/data/monitoring/crowdsec-exporter
    restart: unless-stopped

    network_mode: host

    cap_add:
      - NET_ADMIN

    volumes:
      - /run/xtables.lock:/run/xtables.lock

    labels:
      - "com.centurylinklabs.watchtower.enable=false"


  grafana:
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped

    volumes:
      - /home/james/docker/data/monitoring/grafana/data:/var/lib/grafana
      - /home/james/docker/data/monitoring/grafana/dashboards:/etc/grafana/dashboards
      - /home/james/docker/data/monitoring/grafana/provisioning:/etc/grafana/provisioning

    networks:
      - apps

    environment:
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=jrwroberts1976@gmail.com
      - GF_SMTP_PASSWORD=${GRAFANA_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=jrwroberts1976@gmail.com
      - GF_SMTP_SKIP_VERIFY=false

    labels:
      - "com.centurylinklabs.watchtower.enable=true"


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "9090:9090"

    volumes:
      - /home/james/docker/data/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /home/james/docker/data/monitoring/prometheus/data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

    networks:
      - apps

    labels:
      - "com.centurylinklabs.watchtower.enable=true"


  loki:
    image: grafana/loki:2.9.6
    container_name: loki
    restart: unless-stopped

    ports:
      - "3100:3100"

    command: -config.file=/etc/loki/local-config.yaml

    volumes:
      - /home/james/docker/data/monitoring/loki/data:/loki
      - /home/james/docker/data/monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml

    networks:
      - apps

    labels:
      - "com.centurylinklabs.watchtower.enable=true"


  promtail:
    image: grafana/promtail:2.9.6
    container_name: promtail
    restart: unless-stopped

    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/james/docker/data/monitoring/promtail/config.yml:/etc/promtail/config.yml

    command: -config.file=/etc/promtail/config.yml

    networks:
      - apps

    labels:
      - "com.centurylinklabs.watchtower.enable=true"


  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped

    networks:
      - apps


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped

    ports:
      - "8089:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

    privileged: true

    devices:
      - /dev/kmsg

    networks:
      - apps

    labels:
      - "com.centurylinklabs.watchtower.enable=true"


networks:
  apps:
    external: true
    name: homelab_apps
