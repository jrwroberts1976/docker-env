name: Deploy Training Platform

on:
  push:
    branches:
      - main

  repository_dispatch:
    types:
      - content-updated

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Deploy training platform

        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.TRAINING_PLATFORM_HOST }}

          username: james

          key: ${{ secrets.TRAINING_PLATFORM_DEPLOY_KEY }}

          script: |
            cd ~/docker/stacks/training-platform
            ./deploy.sh
