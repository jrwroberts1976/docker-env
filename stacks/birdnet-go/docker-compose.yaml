services:
  birdnet-go:
    image: ghcr.io/tphakala/birdnet-go:20260716
    container_name: birdnet-go
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    mem_limit: 1g


    devices:
      - /dev/snd:/dev/snd

    volumes:
      - /home/james/docker/data/birdnet-go/config:/config
      - /home/james/docker/data/birdnet-go/data:/data

    environment:
      - TZ=Europe/London

    group_add:
      - audio

    security_opt:
      - no-new-privileges:true

    networks:
      - apps

    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"
      - "wud.tag.include=^[0-9]{8}$"
  birdnet-exporter:
    build:
      context: ./birdnet-exporter
      args:
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
        BUILD_CREATED: ${BUILD_CREATED:-unknown}
        BUILD_SOURCE: https://github.com/jrwroberts1976/docker-env
    container_name: birdnet-exporter
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "192.168.2.220:9105:9105"

    volumes:
      - /home/james/docker/data/birdnet-go/data:/data

    networks:
      - apps

networks:
  apps:
    external: true
    name: homelab_apps
