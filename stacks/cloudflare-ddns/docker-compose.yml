services:
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1.17.0
    container_name: cloudflare-ddns
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    environment:
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
      DOMAINS: jrwroberts.co.uk
      PROXIED: "true"
      IP6_PROVIDER: none

    secrets:
      - cloudflare_api_token

secrets:
  cloudflare_api_token:
    file: /home/james/docker/secrets/cloudflare-api-token
