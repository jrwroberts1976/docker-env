services:

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.15.0
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "192.168.2.220:81:81"
      - "443:443"
    volumes:
      - /home/james/docker/data/proxy-auth/npm/data:/data
      - /home/james/docker/data/proxy-auth/npm/letsencrypt:/etc/letsencrypt
    networks:
      - apps


  authelia:
    image: authelia/authelia:4.39.20
    container_name: authelia
    restart: unless-stopped
    ports:
      - "192.168.2.220:9091:9091"
    volumes:
      - /home/james/docker/data/proxy-auth/authelia/config:/config
    environment:
      - TZ=Europe/London
    networks:
      - apps


  duckdns:
    image: lscr.io/linuxserver/duckdns:af6dcae5-ls86
    container_name: duckdns
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - SUBDOMAINS=jrwroberts
      - TOKEN=${DUCKDNS_TOKEN}
      - UPDATE_IP=ipv4
    networks:
      - apps
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"


networks:
  apps:
    external: true
    name: homelab_apps
