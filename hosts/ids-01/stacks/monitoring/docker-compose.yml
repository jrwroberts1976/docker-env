services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.1}
    container_name: prometheus
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - /home/james/docker/data/monitoring/prometheus:/etc/prometheus
      - /home/james/docker/data/monitoring/prometheus/data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"
      - "wud.trigger.exclude=docker.local"
      - "wud.tag.include=^[0-9]+([.][0-9]+){0,2}$"
      - "wud.trigger.exclude=docker.local"
      - 'wud.tag.include=^[0-9]+([.][0-9]+){0,2}$'
    networks:
      - monitoring

  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE:-prom/blackbox-exporter:v0.28.0}
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - /home/james/docker/data/monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"
      - "wud.trigger.exclude=docker.local"
      - "wud.tag.include=^[0-9]+([.][0-9]+){0,2}$"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    environment:
      - GF_SERVER_DOMAIN=grafana.jrwroberts.co.uk
      - GF_SERVER_ROOT_URL=https://grafana.jrwroberts.co.uk/
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_SERVER_ROUTER_LOGGING=true
      - GF_PLUGINS_PREINSTALL=alexanderzobnin-zabbix-app@6.6.0
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=jrwroberts1976@gmail.com
      - GF_SMTP_PASSWORD__FILE=/run/secrets/grafana_smtp_password
      - GF_SMTP_FROM_ADDRESS=jrwroberts1976@gmail.com
      - GF_SMTP_SKIP_VERIFY=false
    secrets:
      - grafana_smtp_password
      - zabbix_grafana_api_token
    entrypoint:
      - /usr/local/bin/run-grafana-with-zabbix-secret
    ports:
      - "3001:3000"
    volumes:
      - /home/james/docker/data/monitoring/grafana/data:/var/lib/grafana
      - /home/james/docker/data/monitoring/grafana/dashboards:/etc/grafana/dashboards
      - /home/james/docker/data/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/email-templates/ng_alert_notification.html:/usr/share/grafana/public/emails/ng_alert_notification.html:ro
      - ./grafana/run-with-zabbix-secret.sh:/usr/local/bin/run-grafana-with-zabbix-secret:ro
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"
      - "wud.trigger.exclude=docker.local"
      - "wud.tag.include=^[0-9]+([.][0-9]+){0,2}$"
    networks:
      - monitoring

  loki:
    image: ${LOKI_IMAGE:-grafana/loki@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500}
    container_name: loki
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - /home/james/docker/data/monitoring/loki/data:/loki
      - /home/james/docker/data/monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"
      - "wud.trigger.exclude=docker.local"
      - "wud.tag.include=^[0-9]+([.][0-9]+){0,2}$"
    networks:
      - monitoring

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.5
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "192.168.2.242:8089:8080"
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro,rslave
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro,rslave
      - /dev/disk:/dev/disk:ro
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"
      - "wud.trigger.exclude=docker.local"
      - "wud.tag.include=^[0-9]+([.][0-9]+){0,2}$"
    networks:
      - monitoring
  wud:
    image: getwud/wud:8
    container_name: wud
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      WUD_WATCHER_LOCAL_WATCHATSTART: "true"
      WUD_WATCHER_LOCAL_CRON: "0 * * * *"
      WUD_TRIGGER_DOCKER_LOCAL_AUTO: "false"
      WUD_TRIGGER_DOCKER_LOCAL_PRUNE: "true"
    ports:
      - "3002:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/james/docker/data/monitoring/wud:/store
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"
      - "wud.trigger.exclude=docker.local"
      - "wud.tag.include=^[0-9]+([.][0-9]+){0,2}$"
    networks:
      - monitoring

secrets:
  grafana_smtp_password:
    file: /home/james/docker/secrets/grafana-smtp-password
  zabbix_grafana_api_token:
    file: /home/james/docker/secrets/zabbix-grafana-api-token

networks:
  monitoring:
    name: monitoring
